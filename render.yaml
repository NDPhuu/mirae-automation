services:
  - type: web
    name: mirae-backend
    env: python
    rootDir: backend
    buildCommand: "pip install poetry && poetry install --no-root"
    startCommand: "poetry run uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
